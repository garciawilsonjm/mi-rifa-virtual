<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Rifa Virtual</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #1a252f;
    }
    p.instrucciones {
      text-align: center;
      color: #666;
    }
    .leyenda {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
    }
    .leyenda-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .caja-color {
      width: 20px;
      height: 20px;
      border-radius: 4px;
    }
    .grid-numeros {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
      gap: 10px;
      margin-top: 20px;
    }
    .numero-btn {
      padding: 15px 5px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .disponible { background-color: #2ecc71; color: white; }
    .disponible:hover { background-color: #27ae60; transform: scale(1.05); }
    .apartado { background-color: #e67e22; color: white; cursor: not-allowed; }
    .comprado { background-color: #e74c3c; color: white; cursor: not-allowed; }

    /* Modal / Formulario */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }
    .modal-contenido {
      background: white;
      padding: 25px;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
    }
    .modal-contenido input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .btn-confirmar {
      width: 100%;
      padding: 12px;
      background: #2ecc71;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Gran Rifa Virtual</h1>
    <p class="instrucciones">Selecciona el número que deseas apartar:</p>

    <div class="leyenda">
      <div class="leyenda-item"><div class="caja-color disponible"></div> Disponible</div>
      <div class="leyenda-item"><div class="caja-color apartado"></div> Apartado</div>
      <div class="leyenda-item"><div class="caja-color comprado"></div> Pagado</div>
    </div>

    <div id="gridRifa" class="grid-numeros">
      <!-- Los números se cargan dinámicamente aquí -->
    </div>
  </div>

  <!-- Formulario Modal para Apartar -->
  <div id="modalApartar" class="modal">
    <div class="modal-contenido">
      <h2>Apartar Número <span id="numSeleccionado"></span></h2>
      <form id="formApartar">
        <label>Nombre Completo:</label>
        <input type="text" id="nombreCliente" required placeholder="Tu nombre">
        
        <label>Teléfono / WhatsApp:</label>
        <input type="tel" id="telefonoCliente" required placeholder="Tu número de contacto">

        <button type="submit" class="btn-confirmar">Confirmar Apartado</button>
      </form>
    </div>
  </div>

  <script>
    // REEMPLAZA ESTOS DOS VALORES CON TUS LLAVES DE SUPABASE
    const SUPABASE_URL = "https://fnjwavaacddazjnzsuzy.supabase.co/rest/v1/";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZuandhdmFhY2RkYXpqbnpzdXp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NTcyMTEsImV4cCI6MjEwODAzMzIxMX0.sDvaGwwZXFMenjbe-GonTjtCQX1nzV4fW6fTohmGY4E";

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let numeroElegido = null;

    async function cargarNumeros() {
      const { data: numeros, error } = await _supabase
        .from('rifa')
        .select('numero, estado')
        .order('numero', { ascending: true });

      if (error) {
        console.error("Error al cargar números:", error);
        return;
      }

      const grid = document.getElementById('gridRifa');
      grid.innerHTML = '';

      numeros.forEach(item => {
        const btn = document.createElement('button');
        btn.classList.add('numero-btn', item.estado);
        btn.textContent = String(item.numero).padStart(2, '0');

        if (item.estado === 'disponible') {
          btn.onclick = () => abrirModal(item.numero);
        } else {
          btn.disabled = true;
        }

        grid.appendChild(btn);
      });
    }

    function abrirModal(numero) {
      numeroElegido = numero;
      document.getElementById('numSeleccionado').textContent = String(numero).padStart(2, '0');
      document.getElementById('modalApartar').style.display = 'flex';
    }

    document.getElementById('formApartar').onsubmit = async (e) => {
      e.preventDefault();

      const nombre = document.getElementById('nombreCliente').value;
      const telefono = document.getElementById('telefonoCliente').value;

      const { data, error } = await _supabase
        .from('rifa')
        .update({
          estado: 'apartado',
          nombre_cliente: nombre,
          telefono_cliente: telefono
        })
        .eq('numero', numeroElegido)
        .eq('estado', 'disponible');

      if (error) {
        alert("Hubo un error al apartar el número. Intenta de nuevo.");
      } else {
        alert(`¡Número ${String(numeroElegido).padStart(2, '0')} apartado con éxito!`);
        document.getElementById('modalApartar').style.display = 'none';
        cargarNumeros();
      }
    };

    cargarNumeros();
  </script>
</body>
</html>
